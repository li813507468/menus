<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>老王川菜馆 · 电子价目表</title>
<style>
  :root {
    --bg: #171210;
    --card: #221a15;
    --card-border: rgba(212,162,78,.16);
    --gold: #d4a24e;
    --red: #e0512f;
    --text: #f2ead9;
    --dim: #a3987f;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
    max-width:520px; margin:0 auto; min-height:100vh;
  }
  .hero {
    position:relative; padding:52px 22px 30px; text-align:center;
    background:
      radial-gradient(ellipse 120% 80% at 50% -20%, rgba(224,81,47,.22), transparent 60%),
      radial-gradient(ellipse 100% 60% at 50% 120%, rgba(212,162,78,.10), transparent 60%),
      linear-gradient(180deg,#1d1512 0%,#171210 100%);
    border-bottom:1px solid var(--card-border);
  }
  .hero::before {
    content:""; position:absolute; inset:12px; border:1px solid rgba(212,162,78,.18); border-radius:4px;
    pointer-events:none;
  }
  .hero .zh-deco { font-size:13px; letter-spacing:8px; color:var(--gold); opacity:.85; margin-bottom:14px; }
  h1 { font-family:"Noto Serif SC","Songti SC","STSong",serif; font-size:34px; letter-spacing:6px; font-weight:700; }
  .tagline { margin-top:10px; font-size:13.5px; color:var(--dim); letter-spacing:2px; }
  .hero-badges { margin-top:16px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .hero-badges span {
    font-size:11.5px; color:var(--gold); border:1px solid rgba(212,162,78,.35);
    padding:3px 12px; border-radius:20px; letter-spacing:1px;
  }
  .lang-btn {
    position:fixed; top:14px; right:14px; z-index:99;
    background:rgba(23,18,16,.85); backdrop-filter:blur(8px);
    border:1px solid rgba(212,162,78,.4); color:var(--gold);
    font-size:12.5px; padding:7px 15px; border-radius:20px; cursor:pointer;
    letter-spacing:1px; font-weight:600;
  }
  nav {
    position:sticky; top:0; z-index:50; display:flex; gap:8px;
    padding:12px 16px; background:rgba(23,18,16,.92); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--card-border); overflow-x:auto;
  }
  nav::-webkit-scrollbar { display:none; }
  nav a {
    flex-shrink:0; text-decoration:none; color:var(--dim); font-size:14px;
    padding:6px 18px; border-radius:20px; border:1px solid transparent; transition:.2s;
  }
  nav a.active { color:var(--gold); border-color:rgba(212,162,78,.45); background:rgba(212,162,78,.08); }
  main { padding:8px 16px 30px; }
  .section-title {
    display:flex; align-items:baseline; gap:12px; margin:26px 4px 16px;
  }
  .section-title h2 {
    font-family:"Noto Serif SC","Songti SC",serif; font-size:21px; letter-spacing:3px; font-weight:700;
  }
  .section-title .line { flex:1; height:1px; background:linear-gradient(90deg,rgba(212,162,78,.4),transparent); }
  .section-title .en { font-size:11px; color:var(--dim); letter-spacing:2px; }
  .feat-card {
    background:var(--card); border:1px solid var(--card-border); border-radius:14px;
    overflow:hidden; margin-bottom:14px; opacity:0; transform:translateY(14px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .feat-card.visible { opacity:1; transform:none; }
  .feat-card .img-wrap { position:relative; aspect-ratio:16/9; background:linear-gradient(135deg,#2a201a,#1d1712); }
  .feat-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .badge {
    position:absolute; top:12px; left:12px; background:linear-gradient(135deg,var(--red),#b53d20);
    color:#fff; font-size:11.5px; letter-spacing:2px; padding:4px 12px; border-radius:3px; font-weight:600;
  }
  .feat-info { padding:14px 16px 16px; }
  .item-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .feat-info h3 { font-family:"Noto Serif SC","Songti SC",serif; font-size:19px; letter-spacing:1px; }
  .spice { font-size:12px; letter-spacing:1px; }
  .spice .pep { opacity:.95; }
  .price { margin-left:auto; color:var(--gold); font-size:20px; font-weight:700; font-family:Georgia,serif; }
  .price .yen { font-size:13px; margin-right:1px; opacity:.85; }
  .desc { margin-top:6px; font-size:13px; color:var(--dim); }
  .card {
    display:flex; gap:14px; background:var(--card); border:1px solid var(--card-border);
    border-radius:13px; padding:12px; margin-bottom:12px; align-items:center;
    opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s ease;
  }
  .card.visible { opacity:1; transform:none; }
  .card .thumb {
    width:92px; height:92px; flex-shrink:0; border-radius:10px; overflow:hidden;
    background:linear-gradient(135deg,#2a201a,#1d1712);
  }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .card .info { flex:1; min-width:0; }
  .card h3 { font-size:16px; font-weight:600; letter-spacing:.5px; }
  .card .desc { margin-top:3px; font-size:12.5px; }
  .card .item-head .price { font-size:17px; }
  footer {
    margin-top:30px; padding:26px 20px 34px; border-top:1px solid var(--card-border);
    text-align:center; background:linear-gradient(180deg,#171210,#1c1512);
  }
  footer .store-line { font-size:14px; letter-spacing:2px; color:var(--text); }
  footer .meta { margin-top:8px; font-size:12.5px; color:var(--dim); line-height:1.9; }
  footer .disclaimer { margin-top:14px; font-size:11px; color:#6e6353; letter-spacing:1px; }
  .qr-hint {
    margin-top:18px; font-size:11.5px; color:#7a6c55; letter-spacing:1px;
    border-top:1px dashed rgba(212,162,78,.2); padding-top:14px;
  }
</style>
</head>
<body>

<button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button>

<header class="hero">
  <div class="zh-deco" data-i18n="deco">川 味 传 承</div>
  <h1><span data-i18n="store">老王川菜馆</span></h1>
  <div class="tagline" data-i18n="tagline">现炒现做 · 拒绝预制菜 · 米饭免费续</div>
  <div class="hero-badges">
    <span data-i18n="b1">扫码即看</span>
    <span data-i18n="b2">价格实时更新</span>
    <span data-i18n="b3">无需关注公众号</span>
  </div>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<footer>
  <div class="store-line" data-i18n="store">老王川菜馆</div>
  <div class="meta">
    <div data-i18n="hours">营业时间 10:30 – 21:30</div>
    <div data-i18n="addr">地址：幸福路 88 号 · 订座 138-0000-0000</div>
  </div>
  <div class="disclaimer" data-i18n="disc">图片仅供参考，请以实物为准 · 价格以店内为准</div>
  <div class="qr-hint" data-i18n="qr">电子价目表 · 老板扫码可自助改价</div>
</footer>

<script>
const I18N = {
  en: {
    deco:"SICHUAN HERITAGE", store:"Lao Wang Sichuan Kitchen",
    tagline:"Fresh wok-cooked · No pre-made food · Free rice refills",
    b1:"Scan to view", b2:"Live prices", b3:"No follow required",
    hours:"Open daily 10:30 – 21:30",
    addr:"88 Xingfu Road · Reservations 138-0000-0000",
    disc:"Images for reference only · Prices in-store prevail",
    qr:"Digital menu · Owner can update prices anytime",
    pick:"SIGNATURE"
  },
  zh: {
    deco:"川 味 传 承", store:"老王川菜馆",
    tagline:"现炒现做 · 拒绝预制菜 · 米饭免费续",
    b1:"扫码即看", b2:"价格实时更新", b3:"无需关注公众号",
    hours:"营业时间 10:30 – 21:30",
    addr:"地址：幸福路 88 号 · 订座 138-0000-0000",
    disc:"图片仅供参考，请以实物为准 · 价格以店内为准",
    qr:"电子价目表 · 老板扫码可自助改价",
    pick:"招牌"
  }
};

const MENU = [
  {
    id:"signature", zh:"招牌必点", en:"Signature",
    items:[
      {
        name:{zh:"水煮鱼",en:"Boiled Fish in Chili Oil"}, price:68, spice:3, featured:true,
        desc:{zh:"滚油锁鲜，鱼片嫩滑，麻辣过瘾",en:"Tender fish in fiery chili oil, numbing & rich"},
        img:"img/shuizhuyu.jpg"
      },
      {
        name:{zh:"回锅肉",en:"Twice-Cooked Pork"}, price:38, spice:2, featured:true,
        desc:{zh:"肥而不腻，灯盏窝形，下饭神器",en:"Caramelized pork belly with green peppers"},
        img:"img/huiguorou.jpg"
      }
    ]
  },
  {
    id:"dishes", zh:"经典热菜", en:"Classic Dishes",
    items:[
      {
        name:{zh:"麻婆豆腐",en:"Mapo Tofu"}, price:28, spice:3,
        desc:{zh:"麻辣烫香，豆腐嫩滑入味",en:"Silky tofu in numbing chili sauce"},
        img:"img/mapotofu.jpg"
      },
      {
        name:{zh:"宫保鸡丁",en:"Kung Pao Chicken"}, price:32, spice:2,
        desc:{zh:"荔枝口糖醋汁，花生酥脆",en:"Sweet-tangy chicken with crunchy peanuts"},
        img:"img/kungpao.jpg"
      },
      {
        name:{zh:"鱼香茄子",en:"Yuxiang Eggplant"}, price:22, spice:1,
        desc:{zh:"咸甜酸辣，茄子软糯入味",en:"Braised eggplant in garlic sauce"},
        img:"img/eggplant.jpg"
      },
      {
        name:{zh:"酸辣土豆丝",en:"Hot & Sour Potato"}, price:18, spice:2,
        desc:{zh:"刀工现切，酸辣爽脆",en:"Crisp shredded potato, tangy & hot"},
        img:"img/potato.jpg"
      }
    ]
  },
  {
    id:"staples", zh:"主食", en:"Staples",
    items:[
      {
        name:{zh:"担担面",en:"Dandan Noodles"}, price:15, spice:3,
        desc:{zh:"红油芝麻香，一碗上头",en:"Noodles in sesame chili sauce"},
        img:"img/dandan.jpg"
      },
      {
        name:{zh:"米饭",en:"Steamed Rice"}, price:2, spice:0,
        desc:{zh:"东北五常大米，免费续",en:"Premium rice, free refills"},
        img:"img/rice.jpg"
      }
    ]
  }
];

let lang = "zh";
const $ = s => document.querySelector(s);

function spiceHtml(n){
  if(!n) return "";
  return `<span class="spice">${'<span class="pep">🌶</span>'.repeat(n)}</span>`;
}

function render(){
  const t = I18N[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  $("#langBtn").textContent = lang === "zh" ? "EN" : "中文";
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    if(t[k]) el.textContent = t[k];
  });

  $("#nav").innerHTML = MENU.map(c =>
    `<a href="#${c.id}" data-nav="${c.id}">${lang==="zh"?c.zh:c.en}</a>`
  ).join("");

  $("#main").innerHTML = MENU.map(c => `
    <section id="${c.id}">
      <div class="section-title">
        <h2>${lang==="zh"?c.zh:c.en}</h2>
        <span class="line"></span>
        <span class="en">${lang==="zh"?c.en:c.zh}</span>
      </div>
      ${c.items.map(i => i.featured ? `
        <div class="feat-card">
          <div class="img-wrap">
            <img src="${i.img}" alt="${i.name[lang]}" loading="lazy">
            <span class="badge">${t.pick}</span>
          </div>
          <div class="feat-info">
            <div class="item-head">
              <h3>${i.name[lang]}</h3>
              ${spiceHtml(i.spice)}
              <span class="price"><span class="yen">¥</span>${i.price}</span>
            </div>
            <div class="desc">${i.desc[lang]}</div>
          </div>
        </div>` : `
        <div class="card">
          <div class="thumb"><img src="${i.img}" alt="${i.name[lang]}" loading="lazy"></div>
          <div class="info">
            <div class="item-head">
              <h3>${i.name[lang]}</h3>
              ${spiceHtml(i.spice)}
              <span class="price"><span class="yen">¥</span>${i.price}</span>
            </div>
            <div class="desc">${i.desc[lang]}</div>
          </div>
        </div>`).join("")}
    </section>
  `).join("");

  observeCards();
}

function toggleLang(){
  lang = lang === "zh" ? "en" : "zh";
  render();
}

function observeCards(){
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add("visible"); io.unobserve(e.target); } });
  }, {threshold:.1});
  document.querySelectorAll(".feat-card,.card").forEach(el => io.observe(el));

  const sections = MENU.map(c => document.getElementById(c.id)).filter(Boolean);
  const so = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting){
        document.querySelectorAll("nav a").forEach(a =>
          a.classList.toggle("active", a.dataset.nav === e.target.id));
      }
    });
  }, {rootMargin:"-30% 0px -60% 0px"});
  sections.forEach(s => so.observe(s));
}

render();
</script>
</body>
</html>
